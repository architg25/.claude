namespace: '{{SERVICE_NAME}}-http-load-test'

headers:
  x-spotify-clientid: '{{SERVICE_NAME}}-load-test'
  x-request-id: '{{uuid}}'

targets:
  - name: '{{SERVICE_NAME}} HTTP Load Test'
    target_id: '{{TARGET_ID}}'
    requests_per_second: {{REQUESTS_PER_SECOND}}
    duration_seconds: {{DURATION_SECONDS}}
    ramp_up_duration_seconds: {{RAMP_UP_SECONDS}}
    estimated_service_response_time_millis: {{ESTIMATED_RESPONSE_TIME_MS}}
    region: '{{REGION}}'
    environment: '{{ENVIRONMENT}}'
    base_service_uri: '{{BASE_SERVICE_URI}}'
    source:
      http:
        - path: '{{ENDPOINT_PATH}}'
          method: '{{HTTP_METHOD}}'
          expected_status: 200
