namespace: '{{SERVICE_NAME}}-grpc-load-test'

proto:
  import_path: '{{PROTO_PATH}}'
  files:
    - '{{PROTO_FILE}}'

targets:
  - name: '{{SERVICE_NAME}} gRPC Load Test'
    target_id: '{{TARGET_ID}}'
    requests_per_second: {{REQUESTS_PER_SECOND}}
    duration_seconds: {{DURATION_SECONDS}}
    ramp_up_duration_seconds: {{RAMP_UP_SECONDS}}
    estimated_service_response_time_millis: {{ESTIMATED_RESPONSE_TIME_MS}}
    region: '{{REGION}}'
    environment: '{{ENVIRONMENT}}'
    base_service_uri: 'grpc://{{SERVICE_HOST}}:{{GRPC_PORT}}'
    source:
      grpc:
        - service: '{{GRPC_SERVICE}}'
          method: '{{GRPC_METHOD}}'
          metadata:
            x-request-id: '{{uuid}}'
          request:
            {{REQUEST_FIELDS}}
          expected_status: OK
