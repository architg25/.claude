# Locus cache configuration for {{SERVICE_NAME}}
memcached {
  locus {
    projectId: "{{GCP_PROJECT}}"
    name: "{{SERVICE_NAME}}-locus"
    max-outstanding-requests: {{MAX_REQUESTS}}
    split-clients: true
  }
}

# Local Caffeine cache (multilevel)
caffeine {
  {{CACHE_NAME}} {
    maximumSize: {{LOCAL_CACHE_SIZE}}
    expireAfterWrite: {{LOCAL_TTL}}
  }
}
