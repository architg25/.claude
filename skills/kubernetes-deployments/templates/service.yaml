apiVersion: v1
kind: Service
metadata:
  name: {{SERVICE_NAME}}
  namespace: {{NAMESPACE}}
  annotations:
    nameless.spotify.com/srv-expose: "true"
spec:
  type: ClusterIP
  selector:
    app: {{SERVICE_NAME}}
  ports:
    - name: grpc
      port: 5990
      targetPort: 5990
    - name: http
      port: 8080
      targetPort: 8080
    - name: hm
      port: 5700
      targetPort: 5700
    - name: hm-snoop
      port: 5701
      targetPort: 5701
