metadata:
  schemaVersion: 5
components:
  {{SERVICE_NAME}}:
    - service_info: service-info.yaml
      panels:
        - template: apollo
          type: bundle
          exclude_grpc: false
          override:
            grpc/server/rpc-error-ratio:
              threshold_pct: {{ERROR_THRESHOLD}}
              action: pagerduty
            http/server/latency-p99:
              threshold_ms: {{LATENCY_THRESHOLD}}
              action: pagerduty
